name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  REGISTRY: deploymentdnyamosacr.azurecr.io
  WORKOUT_IMAGE: workoutapp-api
  USER_IMAGE: user-api

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore workoutapp-API.sln

      - name: Build
        run: dotnet build workoutapp-API.sln --no-restore -c Release

      - name: Test
        run: dotnet test workoutapp-API.sln --no-build -c Release

  deploy-workout-api:
    name: Deploy Workout API to Azure Container Apps
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name deploymentdnyamosacr

      - name: Build and push Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.WORKOUT_IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.WORKOUT_IMAGE }}:latest \
            ./workoutapp-API

          docker push ${{ env.REGISTRY }}/${{ env.WORKOUT_IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.WORKOUT_IMAGE }}:latest

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ secrets.WORKOUT_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.WORKOUT_IMAGE }}:${{ github.sha }}

  deploy-user-api:
    name: Deploy User API to Azure Container Apps
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name deploymentdnyamosacr

      - name: Build and push Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.USER_IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.USER_IMAGE }}:latest \
            ./User-API

          docker push ${{ env.REGISTRY }}/${{ env.USER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.USER_IMAGE }}:latest

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ secrets.USER_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.USER_IMAGE }}:${{ github.sha }}
